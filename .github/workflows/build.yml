name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Limen/Limen.csproj -c Release --nologo

      - name: Publish single file
        run: >
          dotnet publish src/Limen/Limen.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o outputs/Limen --nologo

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item README.md outputs/Limen/README.md
          Compress-Archive -Path outputs/Limen/* -DestinationPath "Limen-win-x64-$version.zip"
          Copy-Item outputs/Limen/Limen.exe "Limen-$version.exe"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Limen-*.exe
            Limen-win-x64-*.zip
          body: |
            Download `Limen-${{ github.ref_name }}.exe` and run it — no install needed.

            The binary is not code-signed, so SmartScreen warns on first launch:
            choose **More info → Run anyway**.
